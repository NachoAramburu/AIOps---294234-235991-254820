apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharmago-ui
  namespace: pharmago
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pharmago-ui
  template:
    metadata:
      labels:
        app: pharmago-ui
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values: [frontend]
        # Letra: dos microservicios distintos no pueden compartir nodo (D02).
        # Solo se excluye a los otros microservicios: las réplicas propias sí pueden compartir nodo.
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values: [pharmago-api-gateway, pharmago-users-service, pharmago-pharmacy-service]
      containers:
      - name: pharmago-ui
        image: pharmago-ui:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        # Probes rápidas (D12): la readiness saca de servicio a un pod enfermo en ~4 s (2 x 2 s)
        # y la liveness lo reinicia en ~6 s (2 x 3 s). La startup da hasta 120 s al arranque
        # sin que la liveness lo mate antes de tiempo.
        startupProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 2
          failureThreshold: 60
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 2
          failureThreshold: 2
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 3
          failureThreshold: 2
          timeoutSeconds: 2
