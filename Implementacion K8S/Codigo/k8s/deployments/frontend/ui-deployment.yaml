apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharmago-ui
  namespace: pharmago
spec:
  replicas: 2
  # Despliegue seguro (C08, D20): el pod nuevo tiene que estar listo 5 s antes de apagar uno viejo,
  # así la capacidad nunca baja durante un rollout.
  revisionHistoryLimit: 5
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: pharmago-ui
  template:
    metadata:
      labels:
        app: pharmago-ui
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values: [frontend]
        # Letra: dos microservicios distintos no pueden compartir nodo (D02).
        # Solo se excluye a los otros microservicios: las réplicas propias sí pueden compartir nodo.
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values: [pharmago-api-gateway, pharmago-users-service, pharmago-pharmacy-service]
      terminationGracePeriodSeconds: 30
      containers:
      - name: pharmago-ui
        # IMAGE_TAG lo reemplazan apply-k8s.sh y deploy.sh por el SHA corto de git (D21).
        image: pharmago-ui:IMAGE_TAG
        imagePullPolicy: Never
        # preStop: espera 5 s antes de apagar, para que el pod salga del Service y del balanceo
        # antes de dejar de atender. Así no se cortan requests en vuelo (C08).
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 5"]
        ports:
        - containerPort: 80
        resources:
          requests:
            ephemeral-storage: "64Mi"
            memory: "128Mi"
            cpu: "50m"
          limits:
            ephemeral-storage: "512Mi"
            memory: "256Mi"
            cpu: "200m"
        # Probes rápidas (D12): la readiness saca de servicio a un pod enfermo en ~4 s (2 x 2 s)
        # y la liveness lo reinicia en ~6 s (2 x 3 s). La startup da hasta 120 s al arranque
        # sin que la liveness lo mate antes de tiempo.
        startupProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 2
          failureThreshold: 60
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 2
          failureThreshold: 2
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 3
          failureThreshold: 2
          timeoutSeconds: 2
