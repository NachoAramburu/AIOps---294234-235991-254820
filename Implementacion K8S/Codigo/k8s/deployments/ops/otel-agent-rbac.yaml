# Permisos del DaemonSet otel-agent (C12): leer las estadísticas del kubelet de su nodo.
# Reglas según el README del receiver kubeletstats v0.111.0 (D37):
#  - nodes/stats: obligatorio.
#  - nodes/proxy: necesario para las métricas *_limit_utilization (el receiver lee los límites de /pods).
#  - nodes: get, para los metadatos del nodo.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-agent
  namespace: pharmago
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-agent
rules:
  - apiGroups: [""]
    resources: ["nodes/stats", "nodes/proxy", "nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-agent
subjects:
  - kind: ServiceAccount
    name: otel-agent
    namespace: pharmago
