apiVersion: apps/v1
kind: Deployment
metadata:
  name: otlp-collector
  namespace: pharmago
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otlp-collector
  template:
    metadata:
      labels:
        app: otlp-collector
    spec:
      # Cuenta con permisos de lectura sobre la API para el receiver k8s_cluster (C12).
      serviceAccountName: otel-collector
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values: [ops, all]
      containers:
      - name: otlp-collector
        image: otel/opentelemetry-collector-contrib:0.111.0
        ports:
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 8889
          name: prometheus
        args:
          - "--config=/etc/otel-collector-config.yaml"
        env:
        # Límite blando para el runtime de Go, por debajo del límite del contenedor (D55).
        - name: GOMEMLIMIT
          value: "400MiB"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            # Con 256Mi quedaba al 92 % en steady state y disparaba pg-memory sin falla (C18, D55).
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: otel-config
          mountPath: /etc/otel-collector-config.yaml
          subPath: otel-collector-config.yaml
      volumes:
      - name: otel-config
        configMap:
          name: otel-collector-config

