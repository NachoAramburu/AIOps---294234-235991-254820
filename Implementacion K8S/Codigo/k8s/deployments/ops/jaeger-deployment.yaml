apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: pharmago
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      # Herramienta de operación: va al nodo ops, con el resto de la observabilidad.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values: [ops]
      containers:
      - name: jaeger
        # all-in-one: collector, almacenamiento en memoria y UI en un solo contenedor (D34).
        image: jaegertracing/all-in-one:1.60.0
        args:
          # Tope de trazas en memoria: al llegar a 5000 descarta las más viejas en vez de crecer sin límite.
          - "--memory.max-traces=5000"
        env:
        - name: COLLECTOR_OTLP_ENABLED
          value: "true"
        ports:
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 16686
          name: ui
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        readinessProbe:
          httpGet:
            path: /
            port: 16686
          periodSeconds: 5
          failureThreshold: 3
