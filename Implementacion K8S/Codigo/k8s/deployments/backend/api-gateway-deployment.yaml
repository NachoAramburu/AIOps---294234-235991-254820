apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharmago-api-gateway
  namespace: pharmago
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pharmago-api-gateway
  template:
    metadata:
      labels:
        app: pharmago-api-gateway
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values: [gateway]
        # Letra: dos microservicios distintos no pueden compartir nodo (D02).
        # Solo se excluye a los otros microservicios: las réplicas propias sí pueden compartir nodo.
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values: [pharmago-users-service, pharmago-pharmacy-service, pharmago-ui]
      containers:
      - name: pharmago-api-gateway
        image: pharmago-api-gateway:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        # Recursos reducidos para nodos ~5GB (proyecto docente)
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "384Mi"
            cpu: "500m"
        # Probes rápidas (D12): la readiness saca de servicio a un pod enfermo en ~4 s (2 x 2 s)
        # y la liveness lo reinicia en ~6 s (2 x 3 s). La startup da hasta 120 s al arranque
        # sin que la liveness lo mate antes de tiempo.
        startupProbe:
          httpGet:
            path: /health/live
            port: 80
          periodSeconds: 2
          failureThreshold: 60
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 80
          periodSeconds: 2
          failureThreshold: 2
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /health/live
            port: 80
          periodSeconds: 3
          failureThreshold: 2
          timeoutSeconds: 2
