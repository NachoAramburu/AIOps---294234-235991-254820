apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: pharmago
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    # Letra: las métricas llegan por OTLP al Collector. Prometheus no scrapea apps ni nodos:
    # su único target es el exporter prometheus del Collector (C10, C12).
    scrape_configs:
      - job_name: 'otlp-collector'
        metrics_path: /metrics
        # honor_labels: se respetan los labels que trae cada serie (job, instance = servicio y
        # réplica de origen) en vez de pisarlos con los del Collector.
        honor_labels: true
        static_configs:
          - targets: ['otlp-collector:8889']
