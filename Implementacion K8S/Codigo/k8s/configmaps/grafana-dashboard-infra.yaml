apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-infra
  namespace: pharmago
data:
  pharmago-infra.json: |
    {"title":"PharmaGo - Infra","uid":"pharmago-infra","tags":["pharmago","infra"],"time":{"from":"now-15m","to":"now"},"refresh":"10s","description":"Métricas de nodo, pod y contenedor por OTLP (otel-agent con kubeletstats y Collector con k8s_cluster). Ver docs/metricas.md.","panels":[{"id":1,"type":"row","title":"Nodos (una serie por nodo, label k8s_node_name)","collapsed":false,"gridPos":{"x":0,"y":0,"w":24,"h":1},"panels":[]},{"id":2,"title":"CPU por nodo (núcleos en uso)","description":"kubeletstats k8s.node.cpu.utilization: CPU usada por el nodo, en núcleos (no es un porcentaje). Cada nodo Minikube es un contenedor con 2 CPU.","type":"timeseries","gridPos":{"x":0,"y":1,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"k8s_node_cpu_utilization_ratio","legendFormat":"{{k8s_node_name}}","refId":"A","datasource":{"type":"prometheus","uid":"prometheus"}}],"fieldConfig":{"defaults":{"unit":"none","min":0},"overrides":[]}},{"id":3,"title":"Memoria por nodo (working set)","description":"kubeletstats k8s.node.memory.working_set: memoria en uso que el kernel no puede liberar. Cada nodo tiene 4 GiB.","type":"timeseries","gridPos":{"x":12,"y":1,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"k8s_node_memory_working_set_bytes","legendFormat":"{{k8s_node_name}}","refId":"A","datasource":{"type":"prometheus","uid":"prometheus"}}],"fieldConfig":{"defaults":{"unit":"bytes","min":0},"overrides":[]}},{"id":4,"title":"Filesystem por nodo: usado y capacidad","description":"kubeletstats k8s.node.filesystem.*. Con el driver docker de Minikube los 5 nodos ven el mismo disco del host (WSL2), así que estas series casi no se distinguen entre nodos. Para storage por pod ver 'Filesystem por pod'. Ver docs/metricas.md.","type":"timeseries","gridPos":{"x":0,"y":9,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"k8s_node_filesystem_usage_bytes","legendFormat":"{{k8s_node_name}} usado","refId":"A","datasource":{"type":"prometheus","uid":"prometheus"}},{"expr":"k8s_node_filesystem_capacity_bytes","legendFormat":"{{k8s_node_name}} capacidad","refId":"B","datasource":{"type":"prometheus","uid":"prometheus"}}],"fieldConfig":{"defaults":{"unit":"bytes","min":0},"overrides":[]}},{"id":5,"title":"Red por nodo (rx y tx)","description":"kubeletstats k8s.node.network.io (interfaz eth0 de cada nodo), bytes por segundo recibidos (receive) y enviados (transmit).","type":"timeseries","gridPos":{"x":12,"y":9,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum by (k8s_node_name, direction) (rate(k8s_node_network_io_bytes_total[1m]))","legendFormat":"{{k8s_node_name}} {{direction}}","refId":"A","datasource":{"type":"prometheus","uid":"prometheus"}}],"fieldConfig":{"defaults":{"unit":"Bps","min":0},"overrides":[]}},{"id":6,"title":"Nodos Ready","description":"k8s_cluster: condición Ready de cada nodo (1 = Ready, 0 = NotReady, -1 = Unknown).","type":"timeseries","gridPos":{"x":0,"y":17,"w":12,"h":6},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"k8s_node_condition_ready","legendFormat":"{{k8s_node_name}}","refId":"A","datasource":{"type":"prometheus","uid":"prometheus"}}],"fieldConfig":{"defaults":{"unit":"none","min":0},"overrides":[]}},{"id":7,"title":"Presión de memoria o disco por nodo","description":"k8s_cluster: condiciones MemoryPressure y DiskPressure (1 = el kubelet empieza a desalojar pods).","type":"timeseries","gridPos":{"x":12,"y":17,"w":12,"h":6},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"k8s_node_condition_memory_pressure","legendFormat":"{{k8s_node_name}} memoria","refId":"A","datasource":{"type":"prometheus","uid":"prometheus"}},{"expr":"k8s_node_condition_disk_pressure","legendFormat":"{{k8s_node_name}} disco","refId":"B","datasource":{"type":"prometheus","uid":"prometheus"}}],"fieldConfig":{"defaults":{"unit":"none","min":0},"overrides":[]}},{"id":8,"type":"row","title":"Pods del namespace pharmago","collapsed":false,"gridPos":{"x":0,"y":23,"w":24,"h":1},"panels":[]},{"id":9,"title":"CPU por pod (núcleos)","description":"kubeletstats k8s.pod.cpu.utilization: núcleos usados por el pod.","type":"timeseries","gridPos":{"x":0,"y":24,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"k8s_pod_cpu_utilization_ratio{k8s_namespace_name=\"pharmago\"}","legendFormat":"{{k8s_pod_name}}","refId":"A","datasource":{"type":"prometheus","uid":"prometheus"}}],"fieldConfig":{"defaults":{"unit":"none","min":0},"overrides":[]},"options":{"legend":{"calcs":["lastNotNull","max"],"displayMode":"table","placement":"right","showLegend":true}}},{"id":10,"title":"Memoria por pod (working set)","description":"kubeletstats k8s.pod.memory.working_set.","type":"timeseries","gridPos":{"x":12,"y":24,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"k8s_pod_memory_working_set_bytes{k8s_namespace_name=\"pharmago\"}","legendFormat":"{{k8s_pod_name}}","refId":"A","datasource":{"type":"prometheus","uid":"prometheus"}}],"fieldConfig":{"defaults":{"unit":"bytes","min":0},"overrides":[]},"options":{"legend":{"calcs":["lastNotNull","max"],"displayMode":"table","placement":"right","showLegend":true}}},{"id":11,"title":"Filesystem por pod (ephemeral-storage usado)","description":"kubeletstats k8s.pod.filesystem.usage: capa escribible y logs del pod, lo que cuenta contra su límite de ephemeral-storage.","type":"timeseries","gridPos":{"x":0,"y":32,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"k8s_pod_filesystem_usage_bytes{k8s_namespace_name=\"pharmago\"}","legendFormat":"{{k8s_pod_name}}","refId":"A","datasource":{"type":"prometheus","uid":"prometheus"}}],"fieldConfig":{"defaults":{"unit":"bytes","min":0},"overrides":[]},"options":{"legend":{"calcs":["lastNotNull","max"],"displayMode":"table","placement":"right","showLegend":true}}},{"id":12,"title":"Memoria del pod contra su límite","description":"kubeletstats k8s.pod.memory_limit_utilization: working set / límite de memoria del pod. Por encima de 1 el contenedor muere por OOM.","type":"timeseries","gridPos":{"x":12,"y":32,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"k8s_pod_memory_limit_utilization_ratio{k8s_namespace_name=\"pharmago\"}","legendFormat":"{{k8s_pod_name}}","refId":"A","datasource":{"type":"prometheus","uid":"prometheus"}}],"fieldConfig":{"defaults":{"unit":"percentunit","min":0,"max":1.2,"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":0.9}]},"custom":{"thresholdsStyle":{"mode":"line"}}},"overrides":[]},"options":{"legend":{"calcs":["lastNotNull","max"],"displayMode":"table","placement":"right","showLegend":true}}},{"id":13,"type":"text","title":"Red por pod: no disponible en este cluster","gridPos":{"x":0,"y":40,"w":24,"h":3},"options":{"mode":"markdown","content":"El kubelet de este cluster (Minikube con cri-dockerd) no informa estadísticas de red por pod, así que `kubeletstats` no emite `k8s.pod.network.*` (verificado en `/stats/summary`, ver `docs/evidencia/C12/`). La red se observa por nodo en el panel **Red por nodo**: cada microservicio vive en su propio nodo, así que la red del nodo `minikube-m03` es la de users, la de `minikube-m04` la de pharmacy, etc."}},{"id":14,"type":"row","title":"Contenedores del namespace pharmago","collapsed":false,"gridPos":{"x":0,"y":43,"w":24,"h":1},"panels":[]},{"id":15,"title":"CPU del contenedor contra su límite","description":"kubeletstats k8s.container.cpu_limit_utilization: CPU usada / límite de CPU. En 1 el contenedor está throttled.","type":"timeseries","gridPos":{"x":0,"y":44,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"k8s_container_cpu_limit_utilization_ratio{k8s_namespace_name=\"pharmago\"}","legendFormat":"{{k8s_pod_name}}/{{k8s_container_name}}","refId":"A","datasource":{"type":"prometheus","uid":"prometheus"}}],"fieldConfig":{"defaults":{"unit":"percentunit","min":0,"max":1.2,"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":0.8}]},"custom":{"thresholdsStyle":{"mode":"line"}}},"overrides":[]},"options":{"legend":{"calcs":["lastNotNull","max"],"displayMode":"table","placement":"right","showLegend":true}}},{"id":16,"title":"Memoria del contenedor contra su límite","description":"kubeletstats container.memory.working_set dividido por k8s_cluster k8s.container.memory_limit. Se calcula así porque el kubelet de este cluster no da los datos que necesita k8s.container.memory_limit_utilization.","type":"timeseries","gridPos":{"x":12,"y":44,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"container_memory_working_set_bytes{k8s_namespace_name=\"pharmago\"} / on(k8s_pod_name, k8s_container_name) max by (k8s_pod_name, k8s_container_name) (k8s_container_memory_limit_bytes{k8s_namespace_name=\"pharmago\"})","legendFormat":"{{k8s_pod_name}}/{{k8s_container_name}}","refId":"A","datasource":{"type":"prometheus","uid":"prometheus"}}],"fieldConfig":{"defaults":{"unit":"percentunit","min":0,"max":1.2,"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":0.9}]},"custom":{"thresholdsStyle":{"mode":"line"}}},"overrides":[]},"options":{"legend":{"calcs":["lastNotNull","max"],"displayMode":"table","placement":"right","showLegend":true}}},{"id":17,"title":"Reinicios por contenedor","description":"k8s_cluster k8s.container.restarts: reinicios acumulados del contenedor (liveness fallida, OOMKilled, crash). Un escalón es un reinicio.","type":"timeseries","gridPos":{"x":0,"y":52,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"k8s_container_restarts{k8s_namespace_name=\"pharmago\"}","legendFormat":"{{k8s_pod_name}}/{{k8s_container_name}}","refId":"A","datasource":{"type":"prometheus","uid":"prometheus"}}],"fieldConfig":{"defaults":{"unit":"none","min":0},"overrides":[]},"options":{"legend":{"calcs":["lastNotNull","max"],"displayMode":"table","placement":"right","showLegend":true}}},{"id":18,"title":"Réplicas deseadas y disponibles por Deployment","description":"k8s_cluster k8s.deployment.desired y k8s.deployment.available. Si disponibles < deseadas, falta capacidad (pod caído, no Ready o Pending).","type":"timeseries","gridPos":{"x":12,"y":52,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"k8s_deployment_desired{k8s_namespace_name=\"pharmago\"}","legendFormat":"{{k8s_deployment_name}} deseadas","refId":"A","datasource":{"type":"prometheus","uid":"prometheus"}},{"expr":"k8s_deployment_available{k8s_namespace_name=\"pharmago\"}","legendFormat":"{{k8s_deployment_name}} disponibles","refId":"B","datasource":{"type":"prometheus","uid":"prometheus"}}],"fieldConfig":{"defaults":{"unit":"none","min":0},"overrides":[]},"options":{"legend":{"calcs":["lastNotNull","max"],"displayMode":"table","placement":"right","showLegend":true}}}],"schemaVersion":38,"version":1}
