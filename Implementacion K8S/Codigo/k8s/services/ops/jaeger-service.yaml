apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: pharmago
spec:
  selector:
    app: jaeger
  ports:
  # El Collector le reenvía las trazas por OTLP gRPC.
  - port: 4317
    targetPort: 4317
    protocol: TCP
    name: otlp-grpc
  # UI y API de consulta (port-forward.sh).
  - port: 16686
    targetPort: 16686
    protocol: TCP
    name: ui
  type: ClusterIP
