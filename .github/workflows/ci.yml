# Pipeline CI/CD del obligatorio (C21 y C22). Explicación en docs/ci-cd.md.
name: CI/CD

on:
  push:
    branches: [team/obligatorio, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend .NET (build y tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Implementacion K8S/Codigo/Backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 6.0.x
      - name: Restore
        run: dotnet restore PharmaGo.sln
      - name: Build
        run: dotnet build PharmaGo.sln -c Release --no-restore
      - name: Tests
        run: dotnet test PharnaGo.Test/PharmaGo.Test.csproj -c Release --no-build

  frontend:
    name: Frontend Angular (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Implementacion K8S/Codigo/Frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 16
      # Igual que su Dockerfile (node:16 y npm install).
      - name: Instalar dependencias
        run: npm install
      - name: Build de producción
        run: npm run build
      - name: Guardar el build para las pruebas BDD
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: Implementacion K8S/Codigo/Frontend/dist/pharma-go
          retention-days: 3

  manifests:
    name: Manifiestos de Kubernetes (kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Instalar kubeconform v0.8.0
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar -xz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: Validar los YAML de k8s
        run: kubeconform -summary -ignore-missing-schemas "Implementacion K8S/Codigo/k8s"

  bdd-smoke:
    name: Pruebas BDD @smoke (Cypress y Cucumber)
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Traer el build del frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: Implementacion K8S/Codigo/e2e/app
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # Sirve el build con fallback a index.html (rutas de Angular) y corre los escenarios @smoke.
      # La API está simulada con cy.intercept: no hace falta el cluster.
      - uses: cypress-io/github-action@v7
        with:
          working-directory: Implementacion K8S/Codigo/e2e
          start: npx serve -s app -l 4200
          wait-on: http://localhost:4200
          command: npm run test:smoke
        env:
          CYPRESS_BASE_URL: http://localhost:4200

  images:
    name: Imagen ${{ matrix.name }}
    needs: [backend, frontend, manifests, bdd-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pharmago-api-gateway
            context: Implementacion K8S/Codigo/Backend
            dockerfile: PharmaGo.ApiGateway/Dockerfile
          - name: pharmago-users-service
            context: Implementacion K8S/Codigo/Backend
            dockerfile: PharmaGo.UsersService/Dockerfile
          - name: pharmago-pharmacy-service
            context: Implementacion K8S/Codigo/Backend
            dockerfile: PharmaGo.PharmacyService/Dockerfile
          - name: pharmago-ui
            context: Implementacion K8S/Codigo/Frontend
            dockerfile: Dockerfile
    steps:
      - uses: actions/checkout@v7
      # Mismo criterio que build-images.sh: el SHA corto del commit.
      - name: Calcular el tag
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Construir ${{ matrix.name }}:${{ env.TAG }}
        working-directory: ${{ matrix.context }}
        run: docker build -f "${{ matrix.dockerfile }}" -t "${{ matrix.name }}:${TAG}" .
      - name: Login a GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar en ghcr.io (solo en main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          docker tag "${{ matrix.name }}:${TAG}" "ghcr.io/${OWNER}/${{ matrix.name }}:${TAG}"
          docker push "ghcr.io/${OWNER}/${{ matrix.name }}:${TAG}"
